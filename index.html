      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconNode = window.lucide.icons[name];
          if (iconNode) {
            const svg = window.lucide.createIcon(name, {
              attrs: { class: className }

                      </span>
                      <h3 className="font-bold text-base text-[#315C45]">{p.title}</h3>
                      <p className="text-xs text-gray-600">{p.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 6. GALERI */}
            {activeTab === 'gallery' && (
              <div className="max-w-6xl mx-auto px-4 py-12 space-y-6">
                <h1 className="text-3xl font-black text-[#315C45]">Galeri Dokumentasi</h1>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  {gallery.map(g => (
                    <div key={g.id} className="bg-white p-3 rounded-3xl border border-[#315C45]/10 shadow">
                      <img src={g.image} alt={g.title} className="w-full h-48 object-cover rounded-2xl" />
                      <h3 className="font-bold text-sm mt-2">{g.title}</h3>
                      <p className="text-xs text-gray-500">{g.caption}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 7. LOGBOOK */}
            {activeTab === 'logbook' && (
              <div className="max-w-3xl mx-auto px-4 py-12 space-y-6">
                <h1 className="text-3xl font-black text-[#315C45]">Logbook Harian Posko</h1>
                <div className="space-y-4">
                  {logbook.map(l => (
                    <div key={l.id} className="bg-white p-5 rounded-3xl border border-[#315C45]/10 shadow space-y-2">
                      <div className="flex justify-between items-center text-xs font-bold">
                        <span className="px-3 py-0.5 rounded-full bg-[#DFF3DC] text-[#315C45]">Hari {l.day}</span>
                        <span className="text-gray-400">{l.date}</span>
                      </div>
                      <h3 className="font-bold text-base text-[#315C45]">{l.activity}</h3>
                      <p className="text-xs text-gray-600">{l.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Login Modal */}
          {loginModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
                <h3 className="text-lg font-black text-[#315C45]">Simulasi Login CMS</h3>
                <p className="text-xs text-gray-500">Pilih salah satu akun pengurus untuk mencoba status login:</p>
                <div className="space-y-2">
                  <button onClick={() => handleQuickLogin('admin', 'Faiz Ahmad')} className="w-full p-3 rounded-2xl bg-[#315C45] text-white text-xs font-bold">
                    Login Sebagai Admin (Faiz)
                  </button>
                  <button onClick={() => handleQuickLogin('contributor', 'Fasya Nurul')} className="w-full p-3 rounded-2xl bg-[#DFF3DC] text-[#315C45] text-xs font-bold">
                    Login Sebagai Anggota (Fasya)
                  </button>
                </div>
                <button onClick={() => setLoginModalOpen(false)} className="text-xs text-gray-400 hover:underline">
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-[#315C45]/10 bg-white py-8 px-4 text-center text-xs text-gray-500 mt-12">
            <div className="max-w-7xl mx-auto space-y-2">
              <div className="font-bold text-[#315C45] font-heading text-sm">
                KKN 224 JAYANTARA • DESA MEKARJAYA 2026
              </div>
              <p>“Membumikan Ekotheologi Berbasis Rahmatan Lil ‘Alamin”</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
